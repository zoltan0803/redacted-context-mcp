name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      # Manual trusted publishing (equivalent to pypa/gh-action-pypi-publish):
      # exchange the GitHub OIDC token for a short-lived PyPI upload token,
      # then upload with twine. Avoids the action's Docker-based internals,
      # whose image is currently unpullable on the runner.
      - name: Mint short-lived PyPI token from OIDC identity
        id: mint
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | jq -r '.value')"
          minted="$(curl -fsS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"${oidc_token}\"}" | jq -r '.token')"
          if [ -z "$minted" ] || [ "$minted" = "null" ]; then
            echo "Failed to mint PyPI token" >&2
            exit 1
          fi
          echo "::add-mask::${minted}"
          echo "token=${minted}" >> "$GITHUB_OUTPUT"
      - name: Upload distributions with twine
        env:
          PYPI_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          python -m twine upload --non-interactive -u __token__ -p "$PYPI_TOKEN" dist/*
