name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile src/redacted_context_mcp/core.py src/redacted_context_mcp/server.py

  documents:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[documents]'
      - run: python -m unittest tests.test_documents tests.test_retrieval tests.test_cli.RedactedContextCliTest.test_document_retrieval_cli tests.test_mcp.RedactedContextMcpTest.test_document_read_and_retrieve_over_stdio

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test built wheel
        shell: python
        run: |
          import glob
          import os
          import subprocess
          import sys
          import tempfile

          project_root = os.path.abspath(os.getcwd())
          wheels = [os.path.abspath(path) for path in glob.glob("dist/*.whl")]
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {wheels!r}")
          with tempfile.TemporaryDirectory() as temp_dir:
              venv_dir = os.path.join(temp_dir, "wheel-smoke")
              subprocess.check_call([sys.executable, "-m", "venv", venv_dir])
              bin_dir = os.path.join(venv_dir, "bin")
              python = os.path.join(bin_dir, "python")
              env = {**os.environ, "PYTHONNOUSERSITE": "1"}
              env.pop("PYTHONPATH", None)
              subprocess.check_call([python, "-m", "pip", "install", wheels[0]], cwd=temp_dir, env=env)
              package_path = subprocess.check_output(
                  [python, "-c", "import redacted_context_mcp; print(redacted_context_mcp.__file__)"],
                  cwd=temp_dir,
                  env=env,
                  text=True,
              ).strip()
              if package_path.startswith(project_root):
                  raise SystemExit(f"Wheel smoke test imported the checkout: {package_path}")
              redctx = os.path.join(bin_dir, "redctx")
              subprocess.check_call([redctx, "--help"], cwd=temp_dir, env=env)
              subprocess.check_call([os.path.join(bin_dir, "redctx-mcp"), "--help"], cwd=temp_dir, env=env)
              subprocess.check_call(
                  [redctx, "--root", os.path.join(project_root, "examples", "quickstart", "context"), "audit"],
                  cwd=temp_dir,
                  env=env,
              )
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  mcp-protocol:
    name: MCP protocol (${{ matrix.protocol_era }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol_era:
          - legacy
          - modern
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Install built wheel
        run: |
          python -m venv mcp-smoke
          mcp-smoke/bin/python -m pip install dist/*.whl
          echo "$PWD/mcp-smoke/bin" >> "$GITHUB_PATH"
      - name: Validate tools and resources with official MCP Inspector
        run: |
          npx --yes @modelcontextprotocol/inspector@2.4.0 --cli \
            --config examples/mcp-inspector.json \
            --server redacted_context_${{ matrix.protocol_era }} \
            --method tools/list \
            --strict
          npx --yes @modelcontextprotocol/inspector@2.4.0 --cli \
            --config examples/mcp-inspector.json \
            --server redacted_context_${{ matrix.protocol_era }} \
            --method resources/list
