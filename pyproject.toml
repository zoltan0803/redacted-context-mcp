[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "redacted-context-mcp"
version = "0.9.0"
description = "Read-only-by-default redacted local knowledgebase context over MCP for coding agents."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Zoltan Nagy" }
]
keywords = [
  "mcp",
  "claude-code",
  "redaction",
  "privacy",
  "pii",
  "filesystem",
  "coding-agents",
  "ollama"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development"
]
dependencies = []

[project.optional-dependencies]
documents = ["markitdown[docx,pptx,pdf,xlsx,xls]>=0.1.7,<0.2"]
# Optional local NER detectors (--detector presidio / --detector gliner).
# Presidio also needs a spaCy model: python -m spacy download en_core_web_lg.
presidio = ["presidio-analyzer>=2.2,<3"]
# gliner does not declare protobuf, which its DeBERTa tokenizer needs. On Linux
# this pulls the default CUDA build of torch; see the README for the CPU wheel.
gliner = ["gliner>=0.2.29,<1", "protobuf>=5.29.5,<8"]
dev = [
  "build>=1.2",
  "twine>=5"
]

[project.urls]
Homepage = "https://github.com/zoltan0803/redacted-context-mcp"
Repository = "https://github.com/zoltan0803/redacted-context-mcp"
Issues = "https://github.com/zoltan0803/redacted-context-mcp/issues"
Changelog = "https://github.com/zoltan0803/redacted-context-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zoltan0803/redacted-context-mcp/blob/main/SETUP.md"
Security = "https://github.com/zoltan0803/redacted-context-mcp/blob/main/SECURITY.md"

[project.scripts]
redctx = "redacted_context_mcp.core:main"
redctx-mcp = "redacted_context_mcp.server:main"

# Detector factories are enabled with --detector NAME[=ARGUMENT]. The built-in
# patterns, presidio, and gliner detectors are resolved before entry points and
# cannot be shadowed, so they are not registered here. Third-party packages
# register factory(argument: str | None) -> Detector in their own pyproject:
#
#   [project.entry-points."redacted_context_mcp.detectors"]
#   mydetector = "my_package.detector:factory"

# README.md is the PyPI project description, but PyPI does not render Mermaid
# diagrams or resolve links relative to the repository. This build-time hook
# replaces each diagram with a pointer to the README on GitHub and turns
# relative file links into absolute GitHub links. README.md stays unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?ms)^```mermaid[ \t]*\n.*?^```[ \t]*$'
replacement = '*This diagram is shown in the [README on GitHub](https://github.com/zoltan0803/redacted-context-mcp#readme).*'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/zoltan0803/redacted-context-mcp/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/redacted_context_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/.github/workflows/test.yml",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SECURITY_INVARIANTS.md",
  "/SETUP.md",
  "/pyproject.toml"
]
